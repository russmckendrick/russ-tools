      <div style="display: flex; flex-direction: column;">
        <div style="display: flex; height: 34px; border-bottom: 1px solid #e8e0cd; align-items: center;">

          <div class="blk" style="width: 96px; height: 11px;"></div>
        </div>

          <div class="blk" style="width: 40px; height: 11px;"></div>
        </div>
        <div style="display: flex; height: 34px; border-bottom: 1px solid #e8e0cd; align-items: center;">

      </div>
    </div>

    <div style="border: 2px solid #17150f; border-radius: 14px; background: #fffdf7; overflow: hidden;">
      <div style="height: 40px; border-bottom: 1px solid #e8e0cd; background: #faf4e8; display: flex; align-items: center; padding: 0 16px;">
        <div class="blk" style="width: 62px; height: 15px;"></div>
      </div>
