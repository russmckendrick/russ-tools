allowBuilds:
  esbuild: true
  # msw's postinstall only prepares the browser service-worker artifact; we
  # use msw/node in tests, which needs no build step.
  msw: false
# pnpm 11+ reads project settings from here (not the "pnpm" field in package.json).
# esbuild needs its install script to run so Vite's native binary is available.
onlyBuiltDependencies:
  - esbuild
ignoredBuiltDependencies:
  - msw
minimumReleaseAgeExclude:
  - react-router@8.3.0
  - brace-expansion@1.1.17 || 1.1.18
  - postcss@8.5.23
  - undici@7.29.0
  - fast-uri@3.1.5
overrides:
  postcss@<=8.5.22: ^8.5.23
  react-router@>=7.12.0 <8.3.0: ^8.3.0
