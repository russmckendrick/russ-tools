name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # Blocking as of Phase 1: the error count is zero and must stay there.
      # Warnings are still permitted — ~234 remain, dominated by the raw-palette
      # ban (no-restricted-syntax), which each tool clears as it is ported.
      # See docs/DESIGN_SPEC.md and docs/plans/redesign-plan.md.
      - name: Lint
        run: pnpm lint
